name: Test Docker Push

on:
  push:
    branches:
      - main

jobs:
  docker-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Docker login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Test Docker push
        run: |
          docker pull hello-world
          docker tag hello-world ${{ secrets.DOCKER_USERNAME }}/blog-service:test
          docker push ${{ secrets.DOCKER_USERNAME }}/blog-service:test
